spring:
  application:
    name: springAi

  datasource:
    url: jdbc:postgresql://localhost:5434/my-vector-db
    username: my-user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            table-name: chat_memory

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3:30b
      embedding:
        options:
          model: nomic-embed-text

logging:
  level:
  # com.zaxxer.hikari: DEBUG
    org.springframework.ai:
            chat.client: DEBUG